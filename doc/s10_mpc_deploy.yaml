# ============================================================
# S10 轮足机器狗 dial-mpc 部署配置
# 用法/框架/进度见 doc/0806.md
# ============================================================

# ---- 硬件档位（决定 dial-mpc 采样规模与 jax 平台）----
# desktop_4090 : 桌面 RTX 4090，GPU(jax[cuda12])，大采样，高质量
# orin_agx     : 比赛 Orin AGX，中等采样（Jetson CUDA 或 CPU），保实时
hardware_profile: desktop_4090

# ---- 部署模式 ----
# 实际模式由环境变量 S10_MODE 控制（auto_nav / remote，默认 remote），
# 此处仅为文档默认值，代码不读取本字段。
mode: auto_nav

# ---- dial-mpc 核心参数（可按 hardware_profile 自动覆盖，见下方 profile）----
env_name: s10_wheeled
Nsample: 2048
Hsample: 14
Hnode: 4
Ndiffuse: 1                 # 高频率版（2026-08-05 定稿）：8.3→17.7Hz；见 0806 §3.3
Ndiffuse_init: 10
temp_sample: 0.05
horizon_diffuse_factor: 0.9
traj_diffuse_factor: 0.5
update_method: mppi
sigma_scale: 1.0
# 定向增大抬腿维度采样噪声（0806 §3.5）：S10_LEG_SIGMA_SCALE=1.5~2.0 可提高
# 采样搜到抬腿轨迹的概率（腿 12 维 ×scale、轮 4 维不变），默认 1.0 各向同性。
dt: 0.02
timestep: 0.02
leg_control: torque
action_scale: 1.0
kp: 80.0
kd: 2.0
solver_iterations: 4        # 高频率版（it=4/5 能过 wp4→wp5 脊但 y≈26.2 翻车；
                            # it=6 稳但卡脊——待调，见 0806 §3.7）
vel_scale: 56.0             # 轮速上限 = 56*0.081 ≈ 4.54 m/s（可靠竞速档；5.0 档用 62 有翻车风险，真机轮电机约 50rad/s≈4.05）
kd_wheel: 1.2
wheel_tau_scale: 3.0
height_tar: 0.20
base_z_init: 0.20
height_weight: 0.1            # r_height 权重（地形跟随高度；实验 3.0，见 0806 §3.6）
vel_weight: 25.0
ang_vel_weight: 20.0
n_steps: 100000        # 无限跑（比赛结束由航点推进终止）

# ---- 各硬件档位的参数覆盖 ----
hardware:
  desktop_4090:
    jax_platform: cuda        # cuda | cpu；cuda 需 jax[cuda12] + LD_LIBRARY_PATH
    Nsample: 2048
    Hsample: 14
    Hnode: 4
    Ndiffuse: 1               # 高频率版：与顶层一致（否则 hardware 节会覆盖顶层）
    dt: 0.02                  # 50 Hz
  orin_agx:
    jax_platform: cpu         # 若 Jetson 装好 jax[cuda12] 可改 cuda
    Nsample: 1024
    Hsample: 10
    Hnode: 4
    Ndiffuse: 1               # 高频率版：真机 Orin 档同步（1024/10/1，估算 2~8Hz 待实测）
    dt: 0.025                 # 40 Hz（放宽实时性）
    kp: 80.0
    kd: 2.0
    # 注：本 hardware 节为文档参考，实际参数以 s10_mpc/mpc_controller.py
    # 的 HARDWARE_PROFILES 为准（已与本节保持一致）。

# ---- 感知层：世界对齐高程瓦片（感知-voxel，已实现，见 doc/0806.md §2.1）----
# 仿真节点读取同名 S10_LOCAL_* 环境变量，本段为文档默认值；代码在
# perception/local_map.py（纯 numpy）+ perception/elevation_lookup.py（jnp 查图）。
perception:
  local_map:
    resolution: 0.1            # 栅格边长 (m)
    tile_size: 8.0             # 锚定瓦片边长 (m)，含 1m 重叠带
    effective_size: 6.0        # 有效输出区边长 (m) -> (60,60)
    voxel_size: 0.05           # 3D 体素边长 (m)
    reanchor_dist: 2.0         # 机器人距瓦片中心超过该值 -> 重锚定 (m)
                               # （链 9 实测 1.5 反而更不稳，保持 2.0）
    max_hang: 1.5              # 相对 base z 上界（滤悬空/顶部结构）(m)
    max_drop: 1.5              # 相对 base z 下界（滤第二层地面）(m)
    max_age: 0.0               # 动态障碍老化 (s)，>0 启用；初赛默认关
  # 高程图进 dial-mpc cost 的权重（已接入，见 dial_mpc/envs/s10_env.py _reward）。
  # 感知侧按固定形状预计算 slope/roughness/step_flag，rollout 只做 gather
  # （perception/elevation_lookup.py terrain_cost）；环境变量可覆盖：
  #   S10_TERRAIN_W_SLOPE / S10_TERRAIN_W_ROUGH / S10_TERRAIN_W_STEP
  # 尺度参考：21% 坡 slope≈0.21 → 每轮 0.42，四轮 ~1.7（轻微，允许爬坡）；
  # step 阈值 0.18m（>轮半径 0.081 且腿够不到才叫台阶）——0.08 会把赛道上
  # 必须翻越的 0.13m 缓坡误判为台阶，把 MPC 逼离走廊（实测卡死根因之一）。
  cost_weights:
    slope: 2.0                 # 坡度代价权重（轻：21% 坡是赛道必经）
    roughness: 1.0             # 粗糙度代价权重
    step: 5.0                  # 台阶（>0.18m 墙/崖）惩罚权重
    step_threshold_m: 0.18     # 台阶判定阈值（避开必须翻越的 0.13m 缓坡）
    ground: 120.0              # 轮-地形贴合（抬腿引导，m² 误差）
    overlift: 0.0              # 过抬惩罚（默认关）：200 会压死抬轮导致卡脊（0806 §3.7）
    leg: 1.0                   # 腿默认姿态正则（保持蹲姿，除非地形需要）
    upright: 25.0              # 地形相对直立（允许顺坡倾斜，罚侧倾/翘头）
    attdamp: 0.8               # 俯仰/侧倾角速度阻尼（杀爬坡振荡）
    stumble: 0.5               # 撞阶惩罚权重（MARG：水平/垂直接触力比 >4 平滑斜坡）
    leg_relax_on_step: 0.2     # 台阶区 r_leg 缩放（放松蹲姿，让抬腿不被罚）
    wheel_air: 0.0             # 牵引感知轮速惩罚（默认关）：实测弹跳误罚导致侧翻，
                               # 待解决弹跳后经 S10_TERRAIN_W_WHEEL_AIR 再启用
  # 前瞻抬轮（MARG feet-air-time 轮式化，见 0806 §2.4）：前轮采样前方高程，
  # 明显高于当前轮下地形时抬高轮目标高度。环境变量可覆盖：
  #   S10_LIFT_LOOKAHEAD / S10_LIFT_MAX / S10_LIFT_THRESHOLD / S10_STUMBLE_RATIO
  lift:
    lookahead: 0.4             # 前轮前瞻距离 (m)
    max_lift: 0.15             # 最大抬轮量 (m)
    threshold: 0.05            # 触发抬轮的最小高差 (m)
    contact_lift_ratio: 100.0  # 接触触发抬轮（默认关）：弹跳力比误触发，见 0806 §3.7
    stumble_ratio: 4.0         # 撞阶力比阈值（MARG 原值 4）
    wheel_ref_force: 20.0      # 单轮参考法向力 (N)（8kg/4≈20N），牵引系数归一化基准
    height_lookahead: 0.35     # 地形跟随前瞻 (m)：目标高 = 机下地形+站姿+clip(前方高差)
    height_lift_cap: 0.15      # 地形跟随抬升上限 (m)

# ---- 模式 A：A* 自动导航 ----
# 待办 5 预留参数（当前未实现；路网=track_overlay 线段，代价栅格=已知地图+感知瓦片）
astar:
  grid_resolution: 0.25       # 全局代价地图分辨率 (m)
  robot_radius: 0.4           # 障碍膨胀半径 (m)
  obstacle_slope: 0.25        # 局部坡度超过此值标为障碍 (m/m)
  waypoint_reach_radius: 0.2  # 航点到达半径（与仿真一致）
  lookahead: 1.5              # MPC 前瞻距离 (m)：取路径上前方该距离的点
  max_speed: 1.0              # 目标速度上限 (m/s)
  yaw_gain: 2.0               # 偏航跟踪增益

# ---- 模式 B：遥控 ----
remote:
  vx_max: 4.5                 # 前后最大速度 (m/s)（可靠竞速档，与 MPC_VX_MAX 一致；激进档 5.0）
  vy_max: 0.5                 # 左右最大速度 (m/s)
  vyaw_max: 2.0               # 转向最大角速度 (rad/s)
  accel_smooth: 2.0           # 指令平滑时间常数 (s)

# ---- 安全 ----
safety:
  max_roll_pitch_deg: 30      # 姿态超限触发回退
  mpc_timeout_s: 0.2          # MPC 无新解超时
  min_base_z: 0.12            # 低于此高度判摔倒
